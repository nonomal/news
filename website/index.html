<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vesti - Web Feed Reader</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
</head>
<body>
  <main>
    <header>
      <nav>
        <a href="https://github.com/bubelov/vesti" class="nav-link">GitHub</a>

    <section class="hero">

      <div class="cta">
        <a href="release.apk" class="btn btn-release">Latest Release APK</a>
        <a href="debug.apk" class="btn btn-preview">Preview APK</a>
        <a href="https://f-droid.org/packages/co.appreactor.news/" class="f-droid-badge">
          <img src="https://fdroid.gitlab.io/artwork/badge/get-it-on-en.svg" alt="Get it on F-Droid">

      </div>
    </section>

    <section class="features">
      <div class="feature">
        <h2>Fast</h2>
        <p>Smooth and snappy even on the older and cheaper devices</p>
      </div>
      <div class="feature">
        <h2>Clean</h2>
        <p>Enjoy modern and minimalistic Material Design</p>
      </div>
      <div class="feature">
        <h2>Open</h2>
        <p>This is a free and open source app</p>
      </div>
    </section>

    <footer>
      <p>Released under GPL-3.0 License</p>
